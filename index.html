<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MindFrame">
<title>MindFrame</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111111' rx='20'/%3E%3Ctext y='68' x='50' font-size='52' text-anchor='middle' font-family='Georgia,serif' fill='%23F5F4F0'%3E⚡%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23111111'/%3E%3Ctext y='122' x='90' font-size='94' text-anchor='middle' font-family='Georgia,serif' fill='%23F5F4F0'%3E⚡%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* === RESET === */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* === TOKENS === */
:root{
  --bg:#F5F4F0;
  --surface:#FFFFFF;
  --surface-2:#EDECEA;
  --ink:#111111;
  --ink-muted:#6B6B6B;
  --ink-faint:#B0ADA8;
  --accent:#3B00F0;
  --accent-dim:rgba(59,0,240,.08);
  --accent-text:#2800A8;
  --correct:#006644;
  --correct-bg:#E6F7F0;
  --wrong:#B91C1C;
  --wrong-bg:#FEE2E2;
  --mission:#6D28D9;
  --mission-bg:rgba(109,40,217,.07);
  --border:#DDD9D0;
  --border-light:#EDECEA;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.04);
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
  --r:10px;
  --r-sm:6px;
  --r-lg:16px;
  --fd:'Fraunces',Georgia,serif;
  --fu:'Inter',-apple-system,system-ui,sans-serif;
  --sidebar:240px;
  --max-w:680px;
  --bn-h:64px;
  --t:.18s ease;
  /* Kontrastfarben auf farbigen Flächen */
  --on-ink:#FFFFFF;       /* Text auf var(--ink)-Flächen */
  --on-accent:#FFFFFF;    /* Text auf var(--accent)-Flächen */
  --ink-hover:#2A2A2A;    /* Hover für btn-primary */
  --done-border:#B3E0D0;
  --case-bg:#111111;      /* Fallstudien-Karte: immer dunkel, themenunabhängig */
  --case-ink:#F5F4F0;
  color-scheme:light;
}

/* === DARK THEME === */
[data-theme="dark"]{
  --bg:#141413;
  --surface:#1D1D1B;
  --surface-2:#282826;
  --ink:#F2F1ED;
  --ink-muted:#A6A49E;   /* ≥5:1 auf --surface — WCAG AA */
  --ink-faint:#71706B;
  --accent:#8B76FF;
  --accent-dim:rgba(139,118,255,.14);
  --accent-text:#B3A3FF;
  --correct:#4CC896;
  --correct-bg:rgba(0,102,68,.24);
  --wrong:#F58A8A;
  --wrong-bg:rgba(185,28,28,.24);
  --mission:#B49AFA;
  --mission-bg:rgba(139,92,246,.13);
  --border:#3A3A37;
  --border-light:#2E2E2C;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --on-ink:#141413;
  --on-accent:#141413;
  --ink-hover:#DEDCD6;
  --done-border:rgba(76,200,150,.35);
  color-scheme:dark;
}

/* === BASE === */
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--fu);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100dvh}
button{cursor:pointer;border:none;background:none;font-family:var(--fu);color:inherit}
a{color:var(--accent-text)}
img{max-width:100%;display:block}

/* Focus — WCAG AA */
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

/* Reduced motion */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* === LAYOUT === */
#app{display:flex;min-height:100dvh}

/* Sidebar */
.sidebar{display:none;width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);flex-direction:column;padding:24px 16px;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto}
@media(min-width:768px){.sidebar{display:flex}}

.sidebar-logo{font-family:var(--fd);font-size:20px;font-weight:600;color:var(--ink);padding:8px 12px 28px;letter-spacing:-.02em}

.sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1}

.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--ink-muted);transition:background var(--t),color var(--t);text-align:left;width:100%;min-height:44px}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.active{background:var(--accent-dim);color:var(--accent-text);font-weight:600}
.nav-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0}

.sidebar-footer{border-top:1px solid var(--border);padding-top:16px;margin-top:8px}

.lang-row{display:flex;gap:6px}
.lang-btn{flex:1;padding:7px 8px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--ink-muted);border:1.5px solid var(--border);transition:all var(--t);min-height:36px}
.lang-btn.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* Main */
.main-wrap{flex:1;padding-bottom:var(--bn-h);min-width:0}
@media(min-width:768px){.main-wrap{margin-left:var(--sidebar);padding-bottom:40px}}

/* Reading progress bar */
.reading-bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform .1s linear;z-index:200;display:none}
@media(min-width:768px){.reading-bar{left:var(--sidebar)}}

/* Views */
.view{display:none;max-width:var(--max-w);margin:0 auto;padding:24px 16px;min-height:calc(100dvh - var(--bn-h))}
@media(min-width:768px){.view{padding:40px 32px;min-height:100vh}}
.view.active{display:block}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--bn-h);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 8px;padding-bottom:env(safe-area-inset-bottom);z-index:100}
@media(min-width:768px){.bottom-nav{display:none}}

.bn-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 8px;border-radius:var(--r-sm);color:var(--ink-muted);font-size:11px;font-weight:500;transition:color var(--t);min-width:52px;min-height:44px;justify-content:center}
.bn-btn.active{color:var(--accent)}
.bn-icon{font-size:20px;line-height:1}

/* === SHARED COMPONENTS === */

/* Heading */
.view-h{font-family:var(--fd);font-size:28px;font-weight:400;color:var(--ink);margin-bottom:24px;letter-spacing:-.02em;line-height:1.2}

/* Section label */
.sec-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);margin-bottom:14px}

/* Back button */
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--ink-muted);padding:8px 0;min-height:44px;transition:color var(--t)}
.back-btn:hover{color:var(--ink)}

/* Buttons */
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--on-ink);border-radius:var(--r);padding:13px 22px;font-size:14px;font-weight:600;transition:background var(--t),transform var(--t);min-height:48px;line-height:1}
.btn-primary:hover{background:var(--ink-hover);transform:translateY(-1px)}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--ink);border:1.5px solid var(--border);border-radius:var(--r);padding:13px 22px;font-size:14px;font-weight:500;transition:border-color var(--t),background var(--t);min-height:48px;line-height:1}
.btn-secondary:hover{border-color:var(--ink);background:var(--surface)}
.btn-danger{border-color:var(--wrong);color:var(--wrong)}
.btn-danger:hover{background:var(--wrong-bg)}

/* Difficulty dots */
.diff-dots{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.diff-dot{width:6px;height:6px;border-radius:50%;background:var(--border)}
.diff-dot.on{background:var(--ink-muted)}

/* Progress bar */
.prog-bar{width:100%;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease}

/* Card base */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}

/* Toast */
.toast{position:fixed;bottom:calc(var(--bn-h) + 16px);left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--on-ink);padding:9px 20px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:999;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:768px){.toast{bottom:24px}}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--ink-muted);font-size:14px;gap:10px}
.spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--ink-muted)}
.empty-icon{font-size:48px;margin-bottom:16px;line-height:1}
.empty-title{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:8px}
.empty-desc{font-size:14px;line-height:1.55}

/* Input */
.input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:14px;font-family:var(--fu);color:var(--ink);background:var(--bg);transition:border-color var(--t);min-height:44px}
.input:focus{outline:none;border-color:var(--accent)}
.input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}

/* === HOME VIEW === */
.home-header{margin-bottom:28px}
.home-greeting{font-family:var(--fd);font-size:27px;font-weight:400;line-height:1.25;margin-bottom:4px}
.home-sub{font-size:14px;color:var(--ink-muted);margin-bottom:14px}

.streak-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:500;color:var(--ink-muted)}

/* Continue card */
.continue-card{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--ink);color:var(--on-ink);border-radius:var(--r-lg);padding:20px;margin-bottom:28px;cursor:pointer;transition:transform var(--t),box-shadow var(--t);text-align:left;width:100%}
.continue-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.continue-card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.cc-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.55;margin-bottom:5px}
.cc-title{font-family:var(--fd);font-size:18px;font-weight:400;line-height:1.3;margin-bottom:8px}
.cc-meta{font-size:13px;opacity:.65;display:flex;gap:8px;flex-wrap:wrap}
.cc-arrow{font-size:22px;flex-shrink:0;opacity:.75}

/* Module grid */
.mod-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:8px}
@media(min-width:480px){.mod-grid{grid-template-columns:1fr 1fr}}

.mod-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color var(--t),box-shadow var(--t);text-align:left;display:flex;flex-direction:column;gap:8px;min-height:44px}
.mod-card:hover{border-color:var(--accent);box-shadow:var(--shadow-sm)}
.mod-card.locked{opacity:.42;cursor:not-allowed;pointer-events:none}
.mod-icon{font-size:26px;line-height:1}
.mod-title{font-size:14px;font-weight:600;color:var(--ink);line-height:1.3}
.mod-meta{font-size:12px;color:var(--ink-muted)}

/* === MODULE VIEW === */
.mod-header{margin-bottom:28px}
.mod-icon-lg{font-size:40px;line-height:1;margin-bottom:12px}
.mod-title-lg{font-family:var(--fd);font-size:30px;font-weight:400;color:var(--ink);margin-bottom:8px;letter-spacing:-.02em;line-height:1.2}
.mod-desc{font-size:15px;color:var(--ink-muted);line-height:1.55}

.lesson-list{display:flex;flex-direction:column;gap:8px}

.lesson-item{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color var(--t);text-align:left;width:100%;min-height:64px}
.lesson-item:hover{border-color:var(--accent)}
.lesson-item.done{background:var(--correct-bg);border-color:var(--done-border)}

.l-num{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink-muted);flex-shrink:0}
.lesson-item.done .l-num{background:var(--correct);color:var(--on-accent)}

.l-info{flex:1;min-width:0}
.l-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:3px}
.l-meta{font-size:12px;color:var(--ink-muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--accent-dim);color:var(--accent-text)}
.badge.green{background:var(--correct-bg);color:var(--correct)}
.badge.purple{background:var(--mission-bg);color:var(--mission)}

/* === LESSON VIEW === */
.lesson-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.lesson-breadcrumb{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-text)}
.lesson-counter{font-size:12px;color:var(--ink-muted)}

.lesson-title{font-family:var(--fd);font-size:30px;font-weight:400;color:var(--ink);line-height:1.2;letter-spacing:-.02em;margin-bottom:12px}
@media(min-width:520px){.lesson-title{font-size:36px}}

.lesson-summary{font-family:var(--fd);font-size:17px;font-weight:300;color:var(--ink-muted);line-height:1.65;margin-bottom:22px;font-style:italic}

.lesson-meta-bar{display:flex;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:32px;flex-wrap:wrap}
.l-meta-item{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-muted)}

.lesson-body{font-family:var(--fd);font-size:17px;font-weight:300;line-height:1.8;color:var(--ink)}
.lesson-body p{margin-bottom:20px}
.lesson-body p:last-child{margin-bottom:0}

/* Lesson section divider */
.l-section{margin-top:36px;padding-top:36px;border-top:1px solid var(--border)}

/* Example */
.example-card{background:var(--surface-2);border-radius:var(--r);padding:20px;border-left:3px solid var(--ink)}
.example-title{font-weight:600;font-size:14px;margin-bottom:10px;color:var(--ink)}
.example-body{font-size:14px;line-height:1.65;color:var(--ink-muted)}

/* Reference */
.ref-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;font-size:13px;line-height:1.5}
.ref-author{font-weight:600;color:var(--ink);margin-bottom:2px}
.ref-title{font-style:italic;color:var(--ink-muted);margin-bottom:4px}
.ref-note{font-size:12px;color:var(--ink-faint)}

/* Field Mission */
.mission-card{background:var(--mission-bg);border:1.5px solid rgba(109,40,217,.18);border-radius:var(--r);padding:20px}
.mission-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.mission-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--mission);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-top:1px;transition:background var(--t),border-color var(--t);background:var(--surface)}
.mission-check:focus-visible{outline:3px solid var(--mission);outline-offset:2px}
.mission-check.done{background:var(--mission);border-color:var(--mission)}
.mission-check.done::after{content:'✓';color:var(--on-accent);font-size:13px;font-weight:700}
.mission-check-title{font-weight:600;font-size:15px;color:var(--mission);line-height:1.3}
.mission-desc{font-size:14px;line-height:1.65;color:var(--ink-muted);padding-left:34px}

/* Lesson CTA */
.lesson-cta{margin-top:40px;padding-top:32px;border-top:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap}

/* === QUIZ VIEW === */
.quiz-back{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.quiz-prog-bar{width:100%;height:4px;background:var(--border);border-radius:2px;margin-bottom:10px;overflow:hidden}
.quiz-prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease}
.quiz-counter{font-size:12px;color:var(--ink-muted);font-weight:500}

.quiz-q{font-family:var(--fd);font-size:22px;font-weight:400;line-height:1.4;color:var(--ink);margin-bottom:24px;letter-spacing:-.01em}

.quiz-options{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.quiz-opt{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 16px;font-size:14px;font-weight:500;color:var(--ink);text-align:left;cursor:pointer;transition:border-color var(--t),background var(--t);line-height:1.45;min-height:52px;width:100%}
.quiz-opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-dim)}
.quiz-opt.correct{border-color:var(--correct);background:var(--correct-bg);color:var(--correct)}
.quiz-opt.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong)}
.quiz-opt:disabled{cursor:not-allowed}

.quiz-feedback{background:var(--surface-2);border-radius:var(--r);padding:16px;font-size:14px;line-height:1.6;color:var(--ink-muted);display:none;margin-bottom:20px}
.quiz-feedback.show{display:block}
.feedback-label{font-weight:600;color:var(--ink);display:block;margin-bottom:4px}

/* Quiz results */
.quiz-results{text-align:center;padding:40px 0}
.results-score{font-family:var(--fd);font-size:72px;font-weight:600;color:var(--ink);line-height:1;margin-bottom:8px}
.results-label{font-size:17px;color:var(--ink-muted);margin-bottom:8px}
.results-sub{font-size:14px;color:var(--ink-faint);margin-bottom:36px;line-height:1.5}
.results-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* === PROGRESS VIEW === */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:32px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 10px;text-align:center}
.stat-val{font-family:var(--fd);font-size:34px;font-weight:400;color:var(--ink);line-height:1;margin-bottom:4px}
.stat-lbl{font-size:11px;font-weight:500;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em}

.prog-mod{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:8px}
.prog-mod-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prog-mod-name{font-size:14px;font-weight:600}
.prog-mod-pct{font-size:12px;color:var(--ink-muted)}

/* === SETTINGS VIEW === */
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px}
.settings-title{font-size:14px;font-weight:600;margin-bottom:4px}
.settings-desc{font-size:13px;color:var(--ink-muted);margin-bottom:16px;line-height:1.55}

/* Install banner */
.install-banner{background:var(--accent-dim);border:1.5px solid rgba(59,0,240,.2);border-radius:var(--r);padding:16px;margin-bottom:20px;display:none;align-items:center;gap:14px}
.install-banner.show{display:flex}
.install-banner p{font-size:13px;color:var(--accent-text);line-height:1.5;flex:1}

/* === REVIEW / SRS === */
.nav-badge{margin-left:auto;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:none;align-items:center;justify-content:center;padding:0 6px}
.nav-badge.show{display:inline-flex}
.bn-wrap{position:relative;display:inline-block}
.bn-badge{position:absolute;top:-5px;right:-12px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:600;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 4px}

.review-hero{padding:8px 0 28px}
.review-hero-kicker{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px}
.review-hero-title{font-family:var(--fd);font-size:clamp(26px,6vw,38px);font-weight:600;line-height:1.15;letter-spacing:-.02em;max-width:520px}
.review-hero-sub{font-size:14px;color:var(--ink-muted);margin-top:12px;line-height:1.6;max-width:460px}

.memory-stairs{display:flex;align-items:flex-end;gap:8px;height:120px;margin:28px 0 6px}
.stair{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.stair-bar{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm) var(--r-sm) 0 0;position:relative;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-size:12px;font-weight:600;color:var(--ink-muted);transition:background var(--t)}
.stair-bar.filled{background:var(--accent-dim);border-color:rgba(59,0,240,.25);color:var(--accent-text)}
.stair-lbl{font-size:10px;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase}
.stairs-caption{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-bottom:24px}

.review-cta-card{background:var(--ink);color:var(--on-ink);border-radius:var(--r-lg);padding:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;transition:transform var(--t)}
.review-cta-card:hover{transform:translateY(-2px)}
.review-cta-title{font-family:var(--fd);font-size:18px;font-weight:600;margin-bottom:4px}
.review-cta-meta{font-size:13px;opacity:.72}
.review-cta-arrow{font-size:22px;flex-shrink:0}

.review-src-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--ink-muted);margin-bottom:16px}

.warmup-card{background:var(--mission-bg);border:1.5px solid rgba(109,40,217,.25);border-radius:var(--r-lg);padding:20px;margin-bottom:24px}
.warmup-kicker{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mission);margin-bottom:6px}
.warmup-title{font-family:var(--fd);font-size:19px;font-weight:600;margin-bottom:4px}
.warmup-sub{font-size:13px;color:var(--ink-muted);line-height:1.55}
.warmup-skip{font-size:13px;font-weight:500;color:var(--ink-muted);text-decoration:underline;text-underline-offset:3px;padding:8px 4px;min-height:44px}
.warmup-skip:hover{color:var(--ink)}

.home-review-card{background:var(--accent-dim);border:1.5px solid rgba(59,0,240,.2);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;transition:transform var(--t)}
.home-review-card:hover{transform:translateY(-2px)}
.hrc-title{font-family:var(--fd);font-size:17px;font-weight:600;color:var(--accent-text);margin-bottom:3px}
.hrc-sub{font-size:13px;color:var(--ink-muted)}

/* === FALLSTUDIE: Mara & Fernweh === */
.case-card{position:relative;background:var(--case-bg);color:var(--case-ink);border-radius:var(--r-lg);padding:26px 22px 22px;overflow:hidden}
.case-card::before{content:'„';position:absolute;top:-28px;right:8px;font-family:var(--fd);font-size:140px;line-height:1;color:rgba(245,244,240,.08);pointer-events:none}
.case-kicker{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.case-brand{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(245,244,240,.55)}
.case-episode{font-size:11px;font-weight:600;color:rgba(245,244,240,.4);white-space:nowrap}
.case-scene{font-family:var(--fd);font-size:17px;line-height:1.65;font-weight:300;letter-spacing:.005em}
.case-behind{margin-top:20px;border-left:3px solid var(--accent);background:rgba(245,244,240,.06);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:14px 16px}

.case-behind-text{font-size:14px;line-height:1.6;color:rgba(245,244,240,.88)}

/* === REVIEW: Vergessenskurve === */

.curve-svg{width:100%;height:auto;display:block}
.curve-caption{font-size:11px;color:var(--ink-faint);margin-top:8px;line-height:1.5}

<script>
// ============================================================
// CONFIG
// ============================================================
const CFG = {
  curriculumUrl: 'data/curriculum.json',
  unlockThreshold: 0.6, // 60% of prev module to unlock next
};

// ============================================================
// STATE
// ============================================================
const S = {
  lang: localStorage.getItem('mf_lang') || 'de',
  view: 'home',
  curriculum: null,
  currentModule: null,   // full module data object
  currentLesson: null,   // lesson object
  progress: JSON.parse(localStorage.getItem('mf_progress') || '{}'),
  streak: parseInt(localStorage.getItem('mf_streak') || '0'),
  lastActivity: localStorage.getItem('mf_last_activity') || null,
  quizIndex: 0,
  quizAnswers: [],
  deferredInstall: null,
};

// ============================================================
// STORAGE
// ============================================================
function saveProgress() {
  localStorage.setItem('mf_progress', JSON.stringify(S.progress));
}

function getLP(lessonId) {
  return S.progress[lessonId] || { completed: false, quizScore: null, missionDone: false };
}

function setLP(lessonId, patch) {
  S.progress[lessonId] = { ...getLP(lessonId), ...patch };
  saveProgress();
}

// ============================================================
// SRS — Spaced Repetition (Leitner, 5 Stufen)
// Frage-ID: "<lessonId>::<questionIndex>"
// Eintrag: { b: Box 1-5, d: Fälligkeitsdatum "YYYY-MM-DD" }
// ============================================================
const SRS = {
  BOX_DAYS: [1, 3, 7, 16, 35], // Intervall nach Erreichen von Box 1..5
  data: JSON.parse(localStorage.getItem('mf_srs') || '{}'),

  save() { localStorage.setItem('mf_srs', JSON.stringify(SRS.data)); },

  today() { return new Date().toISOString().split('T')[0]; },

  addDays(days) {
    const d = new Date();
    d.setDate(d.getDate() + days);
    return d.toISOString().split('T')[0];
  },

  moduleIdOf(lessonId) { return 'module-' + lessonId.slice(1, 3); },

  // Nach Lektions-Quiz: Frage ins System aufnehmen / aktualisieren
  seed(lessonId, qIndex, correct) {
    const qid = `${lessonId}::${qIndex}`;
    const cur = SRS.data[qid];
    if (cur) { SRS.grade(qid, correct); return; }
    const box = correct ? 2 : 1;
    SRS.data[qid] = { b: box, d: SRS.addDays(SRS.BOX_DAYS[box - 1]) };
    SRS.save();
  },

  // Nach Review-Antwort: Box verschieben
  grade(qid, correct) {
    const cur = SRS.data[qid] || { b: 1 };
    const box = correct ? Math.min(cur.b + 1, 5) : 1;
    SRS.data[qid] = { b: box, d: SRS.addDays(SRS.BOX_DAYS[box - 1]) };
    SRS.save();
  },

  due() {
    const today = SRS.today();
    return Object.keys(SRS.data).filter(qid => SRS.data[qid].d <= today);
  },

  boxCounts() {
    const c = [0, 0, 0, 0, 0];
    Object.values(SRS.data).forEach(e => { c[e.b - 1]++; });
    return c;
  },

  // Einmalige Migration: bereits absolvierte Quizze ins SRS holen
  migrate() {
    if (Object.keys(SRS.data).length > 0) return;
    let seeded = false;
    Object.entries(S.progress).forEach(([lessonId, p]) => {
      if (p.quizScore === null || p.quizScore === undefined) return;
      for (let i = 0; i < 3; i++) {
        SRS.data[`${lessonId}::${i}`] = { b: 1, d: SRS.today() };
        seeded = true;
      }
    });
    if (seeded) SRS.save();
  },

  // qid → { question, lesson, module } — Moduldaten müssen geladen sein
  resolve(qid) {
    const [lessonId, qIdxStr] = qid.split('::');
    const modId = SRS.moduleIdOf(lessonId);
    const mod = S.curriculum?.modules.find(m => m.id === modId);
    if (!mod?._data) return null;
    const lesson = mod._data.lessons.find(l => l.id === lessonId);
    const q = lesson?.quiz?.questions[parseInt(qIdxStr, 10)];
    if (!q) return null;
    return { q, lesson, mod };
  },

  // Moduldaten für eine qid-Liste nachladen
  async ensureModules(qids) {
    const modIds = [...new Set(qids.map(qid => SRS.moduleIdOf(qid.split('::')[0])))];
    await Promise.all(modIds.map(async id => {
      const mod = S.curriculum?.modules.find(m => m.id === id);
      if (!mod || mod._data) return;
      try {
        const res = await fetch(mod.file);
        mod._data = await res.json();
      } catch { /* Frage wird übersprungen */ }
    }));
  },
};

// Modul-Fortschritt aus S.progress ableiten — funktioniert auch ohne geladene Moduldaten.
// (Fix: Übersicht zeigte 0%, bis das Modul einmal geöffnet wurde.)
function moduleDoneCount(mod) {
  if (mod._data) return mod._data.lessons.filter(l => getLP(l.id).completed).length;
  const prefix = mod.id.replace('module-', 'm') + '-l'; // "module-03" -> "m03-l"
  return Object.keys(S.progress).filter(id => id.startsWith(prefix) && S.progress[id].completed).length;
}

function courseStats() {
  if (!S.curriculum) return { done: 0, total: 0 };
  let done = 0, total = 0;
  S.curriculum.modules.forEach(m => { done += moduleDoneCount(m); total += m.lessonCount; });
  return { done, total };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateReviewBadges() {
  const n = SRS.due().length;
  ['rev-badge-s', 'rev-badge-b'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = n > 99 ? '99+' : n;
    el.classList.toggle('show', n > 0);
  });
  const lbl = n > 0 ? `Review, ${n} ${t('fällig', 'due')}` : 'Review';
  document.getElementById('nav-review-s')?.setAttribute('aria-label', lbl);
  document.getElementById('nav-review-b')?.setAttribute('aria-label', lbl);
}

// ============================================================
// STREAK
// ============================================================
function updateStreak() {
  const today = new Date().toISOString().split('T')[0];
  const last = S.lastActivity;
  if (!last) return;
  const diff = (new Date(today) - new Date(last)) / 86400000;
  if (diff > 1) { S.streak = 0; localStorage.setItem('mf_streak', 0); }
}

function markActivity() {
  const today = new Date().toISOString().split('T')[0];
  if (S.lastActivity === today) return;
  const last = S.lastActivity;
  if (last) {
    const diff = (new Date(today) - new Date(last)) / 86400000;
    S.streak = diff === 1 ? S.streak + 1 : 1;
  } else {
    S.streak = 1;
  }
  S.lastActivity = today;
  localStorage.setItem('mf_streak', S.streak);
  localStorage.setItem('mf_last_activity', today);
  document.getElementById('streak-num').textContent = S.streak;
}

// ============================================================
// THEME (light / dark / system)
// ============================================================
const THEME = {
  pref: localStorage.getItem('mf_theme') || 'system',
  mq: window.matchMedia('(prefers-color-scheme: dark)'),

  resolved() {
    return THEME.pref === 'system' ? (THEME.mq.matches ? 'dark' : 'light') : THEME.pref;
  },

  apply() {
    const mode = THEME.resolved();
    document.documentElement.setAttribute('data-theme', mode);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'dark' ? '#141413' : '#F5F4F0');
  },

  set(pref) {
    THEME.pref = pref;
    localStorage.setItem('mf_theme', pref);
    THEME.apply();
    if (S.view === 'settings') renderSettings();
  },
};
THEME.mq.addEventListener?.('change', () => { if (THEME.pref === 'system') THEME.apply(); });

function t(de, en) { return S.lang === 'de' ? de : en; }

function applyLang(lang) {
  S.lang = lang;
  localStorage.setItem('mf_lang', lang);
  document.documentElement.lang = lang;

  // Sidebar lang buttons
  document.getElementById('s-lang-de')?.classList.toggle('active', lang === 'de');
  document.getElementById('s-lang-en')?.classList.toggle('active', lang === 'en');
  document.getElementById('s-lang-de')?.setAttribute('aria-pressed', lang === 'de');
  document.getElementById('s-lang-en')?.setAttribute('aria-pressed', lang === 'en');

  // Static text that doesn't re-render
  document.getElementById('home-greeting').textContent = t('Willkommen zurück.', 'Welcome back.');
  document.getElementById('home-sub').textContent = t('Dein Kurs in Behavioral Science.', 'Your Behavioral Science course.');
  document.getElementById('streak-lbl').textContent = t(' Tage Streak', ' day streak');
  document.getElementById('mod-label').textContent = t('Module', 'Modules');
  document.getElementById('mod-back-lbl').textContent = t('Zurück', 'Back');
  document.getElementById('prog-h').textContent = t('Fortschritt', 'Progress');
  document.getElementById('settings-h').textContent = t('Einstellungen', 'Settings');
  document.getElementById('lib-h').textContent = t('Bibliothek', 'Library');

  // Sidebar nav labels
  const navLabels = [
    t('Übersicht', 'Overview'),
    'Review',
    t('Bibliothek', 'Library'),

    t('Einstellungen', 'Settings'),
  ];
  document.querySelectorAll('.nav-btn .nav-lbl').forEach((el, i) => {
    if (navLabels[i]) el.textContent = navLabels[i];
  });

  // Bottom nav labels
  document.getElementById('bn-home').textContent = t('Home', 'Home');
  document.getElementById('bn-rev').textContent = 'Review';
  document.getElementById('bn-lib').textContent = t('Bibliothek', 'Library');

}

// ============================================================
// NAVIGATION
// ============================================================
const APP = {

  setLang(lang) {
    applyLang(lang);
    // Re-render current view
    const view = S.view;
    if (view === 'home') renderHome();
    else if (view === 'module' && S.currentModule) renderModule(S.currentModule);
    else if (view === 'lesson' && S.currentLesson) renderLesson(S.currentLesson);
    else if (view === 'review') renderReviewLanding();
    else if (view === 'library') APP.openLibrary();
    else if (view === 'finale') renderFinale();
    else if (view === 'progress') renderProgress();
    else if (view === 'settings') renderSettings();
  },

  nav(view) {
    S.view = view;
    document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
    const el = document.getElementById(`view-${view}`);
    if (el) { el.classList.add('active'); }

    // Update nav active states
    document.querySelectorAll('[data-nav]').forEach(btn => {
      const active = btn.dataset.nav === view;
      btn.classList.toggle('active', active);
      if (active) btn.setAttribute('aria-current', 'page');
      else btn.removeAttribute('aria-current');
    });

    // Reading bar
    const bar = document.getElementById('reading-bar');
    bar.style.display = view === 'lesson' ? 'block' : 'none';
    if (view !== 'lesson') bar.style.transform = 'scaleX(0)';

    window.scrollTo({ top: 0, behavior: 'instant' });

    // Render
    if (view === 'home') renderHome();
    if (view === 'review') renderReviewLanding();
    if (view === 'library') APP.openLibrary();
    if (view === 'finale') renderFinale();
    if (view === 'progress') renderProgress();
    if (view === 'settings') renderSettings();
  },

  async openModule(moduleId) {
    document.getElementById('mod-content').innerHTML = loadingHTML();
    APP.nav('module');
    const modMeta = S.curriculum?.modules.find(m => m.id === moduleId);
    if (!modMeta) return;
    // Load if not cached
    if (!modMeta._data) {
      try {
        const res = await fetch(modMeta.file);
        modMeta._data = await res.json();
      } catch {
        document.getElementById('mod-content').innerHTML = errorHTML();
        return;
      }
    }
    S.currentModule = modMeta._data;
    renderModule(S.currentModule);
  },

  async openLesson(lessonId) {
    if (!S.currentModule) return;
    const lesson = S.currentModule.lessons.find(l => l.id === lessonId);
    if (!lesson) return;
    S.currentLesson = lesson;
    APP.nav('lesson');
    if (shouldWarmup(lesson)) {
      document.getElementById('lesson-content').innerHTML = loadingHTML();
      await startWarmup(lesson);
    } else {
      renderLesson(lesson);
    }
  },

  startQuiz() {
    if (!S.currentLesson) return;
    S.quizIndex = 0;
    S.quizAnswers = [];
    APP.nav('quiz');
    renderQuizQ();
  },

  async startReview() {
    const due = SRS.due();
    if (due.length === 0) { renderReviewLanding(); return; }
    document.getElementById('review-content').innerHTML = loadingHTML();
    if (S.view !== 'review') APP.nav('review');
    REV.queue = shuffle(due).slice(0, 12); // Shuffle = Interleaving über Module
    REV.idx = 0;
    REV.results = [];
    await SRS.ensureModules(REV.queue);
    REV.queue = REV.queue.filter(qid => SRS.resolve(qid));
    if (REV.queue.length === 0) { renderReviewLanding(); return; }
    renderReviewQ();
  },

  answerReview(optIndex) {
    const r = SRS.resolve(REV.queue[REV.idx]);
    if (!r) return;
    const correct = r.q.correctIndex;
    const isCorrect = optIndex === correct;
    REV.results.push(isCorrect);
    SRS.grade(REV.queue[REV.idx], isCorrect);

    document.querySelectorAll('#review-content .quiz-opt').forEach((btn, i) => {
      btn.disabled = true;
      if (i === correct) btn.classList.add('correct');
      if (i === optIndex && !isCorrect) btn.classList.add('wrong');
    });

    const fb = document.getElementById('rev-fb');
    const exp = S.lang === 'de' ? r.q.explanationDe : r.q.explanationEn;
    const box = SRS.data[REV.queue[REV.idx]].b;
    const nextIn = SRS.BOX_DAYS[box - 1];
    fb.innerHTML = `<span class="feedback-label">${isCorrect ? t('Richtig! ✓', 'Correct! ✓') : t('Nicht ganz.', 'Not quite.')}</span>${exp}<br><small style="color:var(--ink-muted)">${t('Nächste Wiederholung in', 'Next review in')} ${nextIn} ${nextIn === 1 ? t('Tag', 'day') : t('Tagen', 'days')} (${t('Stufe', 'level')} ${box}/5)</small>`;
    fb.classList.add('show');

    const nb = document.getElementById('rev-next-btn');
    if (nb) nb.style.display = 'inline-flex';
  },

  nextReviewQ() {
    REV.idx++;
    renderReviewQ();
    window.scrollTo({ top: 0, behavior: 'instant' });
  },

  answerWarmup(optIndex) {
    const qid = WU.queue[WU.idx];
    const r = SRS.resolve(qid);
    if (!r) return;
    const correct = r.q.correctIndex;
    const isCorrect = optIndex === correct;
    SRS.grade(qid, isCorrect);
    updateReviewBadges();

    document.querySelectorAll('#lesson-content .quiz-opt').forEach((btn, i) => {
      btn.disabled = true;
      if (i === correct) btn.classList.add('correct');
      if (i === optIndex && !isCorrect) btn.classList.add('wrong');
    });

    const fb = document.getElementById('wu-fb');
    const exp = S.lang === 'de' ? r.q.explanationDe : r.q.explanationEn;
    fb.innerHTML = `<span class="feedback-label">${isCorrect ? t('Richtig! ✓', 'Correct! ✓') : t('Nicht ganz.', 'Not quite.')}</span>${exp}`;
    fb.classList.add('show');

    const nb = document.getElementById('wu-next-btn');
    if (nb) nb.style.display = 'inline-flex';
  },

  nextWarmupQ() {
    WU.idx++;
    renderWarmupQ();
  },

  toggleMission(lessonId) {
    const cur = getLP(lessonId);
    const done = !cur.missionDone;
    setLP(lessonId, { missionDone: done });
    const cb = document.getElementById('mission-cb');
    if (cb) {
      cb.classList.toggle('done', done);
      cb.setAttribute('aria-pressed', done);
    }
    if (done) showToast(t('Mission erledigt 🏁', 'Mission done 🏁'));
  },

  markComplete(lessonId) {
    setLP(lessonId, { completed: true });
    markActivity();
    showToast(t('Lektion abgeschlossen ✓', 'Lesson complete ✓'));
    APP.nav('module');
    if (S.currentModule) renderModule(S.currentModule);
  },

  answerQuiz(optIndex) {
    const quiz = S.currentLesson?.quiz;
    if (!quiz) return;
    const q = quiz.questions[S.quizIndex];
    const correct = q.correctIndex;
    const isCorrect = optIndex === correct;
    S.quizAnswers.push(isCorrect);

    // Disable & highlight options
    document.querySelectorAll('.quiz-opt').forEach((btn, i) => {
      btn.disabled = true;
      if (i === correct) btn.classList.add('correct');
      if (i === optIndex && !isCorrect) btn.classList.add('wrong');
    });

    // Show feedback
    const fb = document.getElementById('quiz-fb');
    const exp = S.lang === 'de' ? q.explanationDe : q.explanationEn;
    fb.innerHTML = `<span class="feedback-label">${isCorrect ? t('Richtig! ✓', 'Correct! ✓') : t('Nicht ganz.', 'Not quite.')}</span>${exp}`;
    fb.classList.add('show');

    // Show next button
    const nb = document.getElementById('next-btn');
    if (nb) nb.style.display = 'inline-flex';
  },

  nextQ() {
    S.quizIndex++;
    const quiz = S.currentLesson?.quiz;
    if (!quiz || S.quizIndex >= quiz.questions.length) {
      renderQuizResults();
    } else {
      renderQuizQ();
    }
  },

  resetProgress() {
    if (!confirm(t('Wirklich? Alle Fortschritte werden gelöscht.', 'Really? All progress will be deleted.'))) return;
    S.progress = {};
    S.streak = 0;
    S.lastActivity = null;
    localStorage.removeItem('mf_progress');
    localStorage.removeItem('mf_streak');
    localStorage.removeItem('mf_last_activity');
    localStorage.removeItem('mf_srs');
    localStorage.removeItem('mf_wu');
    SRS.data = {};
    updateReviewBadges();
    document.getElementById('streak-num').textContent = '0';
    renderSettings();
    showToast(t('Fortschritt gelöscht.', 'Progress deleted.'));
  },

  installPWA() {
    if (S.deferredInstall) {
      S.deferredInstall.prompt();
      S.deferredInstall.userChoice.then(() => {
        S.deferredInstall = null;
        document.getElementById('install-banner')?.classList.remove('show');
      });
    }
  },
};

async function loadCurriculum() {
  try {
    const res = await fetch(CFG.curriculumUrl);
    S.curriculum = await res.json();
    // Preload module 01 for continue card
    const first = S.curriculum.modules[0];
    if (first && !first._data) {
      try {
        const r = await fetch(first.file);
        first._data = await r.json();
        if (!S.currentModule) S.currentModule = first._data;
      } catch { /* silent */ }
    }
    renderHome();
  } catch {
    document.getElementById('mod-grid').innerHTML = errorHTML();
  }
}

// RENDER: HOME
// ============================================================
function renderHome() {
  document.getElementById('streak-num').textContent = S.streak;

  // Review card (nur wenn Fragen fällig)
  const revEl = document.getElementById('review-home');
  const dueN = SRS.due().length;
  revEl.innerHTML = dueN > 0 ? `
    <button class="home-review-card" onclick="APP.startReview()" aria-label="${dueN} ${t('Fragen fällig — Review starten', 'questions due — start review')}">
      <div>
        <div class="hrc-title">↻ ${dueN} ${dueN === 1 ? t('Frage', 'question') : t('Fragen', 'questions')} ${t('fällig', 'due')}</div>
        <div class="hrc-sub">${t('Kurz wiederholen, bevor das Vergessen gewinnt.', 'A quick review before forgetting wins.')}</div>
      </div>
      <span class="cc-arrow" aria-hidden="true">→</span>
    </button>` : '';

  // Continue card
  const continueEl = document.getElementById('continue-section');
  const next = findNextLesson();
  if (next) {
    continueEl.innerHTML = `
      <button class="continue-card" onclick="APP.openModule('${next.moduleId}').then(()=>APP.openLesson('${next.lesson.id}'))" aria-label="${t('Weiter lernen', 'Continue learning')}: ${t(next.lesson.titleDe, next.lesson.titleEn)}">
        <div>
          <div class="cc-label">${t('Weiter lernen', 'Continue learning')}</div>
          <div class="cc-title">${t(next.lesson.titleDe, next.lesson.titleEn)}</div>
          <div class="cc-meta">
            <span>${t(next.modTitleDe, next.modTitleEn)}</span>
            <span>·</span>
            <span>${next.lesson.durationMin} Min.</span>
          </div>
        </div>
        <span class="cc-arrow" aria-hidden="true">→</span>
      </button>`;
  } else {
    const cs = courseStats();
    if (cs.total > 0 && cs.done >= cs.total) {
      continueEl.innerHTML = `
        <button class="home-finale-card" onclick="APP.nav('finale')" aria-label="${t('Kurs abgeschlossen — wie geht es weiter?', 'Course complete — what comes next?')}">
          <div>
            <div class="cc-label">${t('Kurs abgeschlossen', 'Course complete')} 🎓</div>
            <div class="cc-title">${t('Alle 8 Module geschafft. Wie geht\'s weiter?', 'All 8 modules done. What\'s next?')}</div>
          </div>
          <span class="cc-arrow" aria-hidden="true">→</span>
        </button>`;
    } else {
      continueEl.innerHTML = `
        <div class="continue-card" style="cursor:default">
          <div>
            <div class="cc-label">${t('Alles erledigt', 'All done')}</div>
            <div class="cc-title">${t('Alle verfügbaren Lektionen abgeschlossen.', 'All available lessons completed.')}</div>
          </div>
          <span class="cc-arrow">✓</span>
        </div>`;
    }
  }

  // Module grid
  if (!S.curriculum) return;
  const grid = document.getElementById('mod-grid');
  grid.innerHTML = S.curriculum.modules.map((mod, i) => {
    const locked = isModuleLocked(mod, i);
    const pct = Math.round((moduleDoneCount(mod) / mod.lessonCount) * 100);
    return `
      <button class="mod-card ${locked ? 'locked' : ''}" ${locked ? 'aria-disabled="true"' : `onclick="APP.openModule('${mod.id}')"`}>
        <span class="mod-icon" aria-hidden="true">${mod.icon}</span>
        <div class="mod-title">${t(mod.titleDe, mod.titleEn)}</div>
        <div class="mod-meta">${mod.lessonCount} ${t('Lektionen', 'lessons')} · ${Math.round(mod.estimatedHours * 60)} Min.</div>
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      </button>`;
  }).join('');
}

function findNextLesson() {
  if (!S.curriculum) return null;
  for (const mod of S.curriculum.modules) {
    if (!mod._data) continue;
    for (const lesson of mod._data.lessons) {
      if (!getLP(lesson.id).completed) {
        return { lesson, moduleId: mod.id, modTitleDe: mod.titleDe, modTitleEn: mod.titleEn };
      }
    }
  }
  return null;
}

function isModuleLocked(mod, index) {
  if (index === 0) return false;
  if (!mod.lockedUntil || !S.curriculum) return false;
  const prevMod = S.curriculum.modules.find(m => m.id === mod.lockedUntil.moduleId);
  if (!prevMod) return true;
  return (moduleDoneCount(prevMod) / prevMod.lessonCount) < mod.lockedUntil.pct / 100;
}

// ============================================================
// RENDER: QUIZ
// ============================================================
function renderQuizQ() {
  const el = document.getElementById('quiz-content');
  if (!el || !S.currentLesson?.quiz) return;
  const quiz = S.currentLesson.quiz;
  const i = S.quizIndex;
  if (i >= quiz.questions.length) { renderQuizResults(); return; }
  const q = quiz.questions[i];

// ============================================================
// WARM-UP — Interleaved Recall vor neuen Lektionen
// ============================================================
const WU = { queue: [], idx: 0, lesson: null };

function warmupCandidates(excludeLessonId) {
  const today = SRS.today();
  return Object.keys(SRS.data)
    .filter(qid => !qid.startsWith(excludeLessonId + '::'))
    .sort((a, b) => SRS.data[a].d.localeCompare(SRS.data[b].d))
    .filter((qid, i, arr) => SRS.data[qid].d <= today || i < 2); // fällige zuerst, sonst die ältesten
}

function shouldWarmup(lesson) {
  if (getLP(lesson.id).completed) return false;
  const shown = JSON.parse(localStorage.getItem('mf_wu') || '{}');
  if (shown[lesson.id] === SRS.today()) return false;
  return warmupCandidates(lesson.id).length >= 2;
}

function markWarmupShown(lessonId) {
  const shown = JSON.parse(localStorage.getItem('mf_wu') || '{}');
  shown[lessonId] = SRS.today();
  localStorage.setItem('mf_wu', JSON.stringify(shown));
}

async function startWarmup(lesson) {
  WU.lesson = lesson;
  WU.idx = 0;
  const cands = warmupCandidates(lesson.id);
  const due = cands.filter(qid => SRS.data[qid].d <= SRS.today());
  WU.queue = shuffle(due.length >= 2 ? due : cands).slice(0, 2);
  await SRS.ensureModules(WU.queue);
  WU.queue = WU.queue.filter(qid => SRS.resolve(qid));
  markWarmupShown(lesson.id);
  if (WU.queue.length === 0) { renderLesson(lesson); return; }
  renderWarmupQ();
}

function renderWarmupQ() {
  const el = document.getElementById('lesson-content');
  if (!el) return;
  if (WU.idx >= WU.queue.length) { renderLesson(WU.lesson); return; }
  const r = SRS.resolve(WU.queue[WU.idx]);
  if (!r) { WU.idx++; renderWarmupQ(); return; }
  const { q, lesson, mod } = r;
  const qText = S.lang === 'de' ? q.questionDe : q.questionEn;
  const opts = S.lang === 'de' ? q.optionsDe : q.optionsEn;

  el.innerHTML = `
    <div class="warmup-card">
      <div class="warmup-kicker">${t('Warm-up', 'Warm-up')} · ${WU.idx + 1}/${WU.queue.length}</div>
      <div class="warmup-title">${t('Bevor es weitergeht: Was weißt du noch?', 'Before we continue: what do you still know?')}</div>
      <div class="warmup-sub">${t('Kurzer Abruf aus', 'Quick recall from')} „${t(lesson.titleDe, lesson.titleEn)}" (${t(mod.titleDe, mod.titleEn)}) — ${t('das verankert Gelerntes, bevor Neues dazukommt.', 'this anchors prior learning before new material arrives.')}</div>
    </div>

    <p class="quiz-q">${qText}</p>

    <div class="quiz-options" role="group" aria-label="${t('Antwortmöglichkeiten', 'Answer options')}">
      ${opts.map((o, oi) => `
        <button class="quiz-opt" onclick="APP.answerWarmup(${oi})">
          ${String.fromCharCode(65 + oi)}. ${o}
        </button>`).join('')}
    </div>

    <div class="quiz-feedback" id="wu-fb" role="alert"></div>

    <div style="display:flex;align-items:center;gap:16px;margin-top:8px">
      <button class="btn-primary" id="wu-next-btn" style="display:none" onclick="APP.nextWarmupQ()">
        ${WU.idx + 1 < WU.queue.length ? t('Nächste Frage →', 'Next question →') : t('Zur Lektion →', 'To the lesson →')}
      </button>
      <button class="warmup-skip" onclick="renderLesson(WU.lesson)">${t('Überspringen', 'Skip')}</button>
    </div>`;

  window.scrollTo({ top: 0, behavior: 'instant' });
}

function diffDots(level) {
  let html = '<span class="diff-dots" aria-hidden="true">';
  for (let i = 1; i <= 3; i++) html += `<span class="diff-dot ${i <= level ? 'on' : ''}"></span>`;
  return html + '</span>';
}

// Fortlaufende Folgen-Nummer aus Lesson-ID (m03-l02 -> 12)
function episodeNum(lessonId) {
  const mod = parseInt(lessonId.slice(1, 3), 10);
  const les = parseInt(lessonId.slice(5, 7), 10);
  return (mod - 1) * 5 + les;
}

function loadingHTML() {
  return `<div class="loading"><div class="spinner" aria-hidden="true"></div>${t('Lädt…', 'Loading…')}</div>`;
}

}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);

window.addEventListener('scroll', () => {

  const bar = document.getElementById('reading-bar');
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const pct = h > 0 ? Math.min(window.scrollY / h, 1) : 0;
  bar.style.transform = `scaleX(${pct})`;
  bar.setAttribute('aria-valuenow', Math.round(pct * 100));
}, { passive: true });

// ============================================================
// BIBLIOTHEK — Glossar & Quellenverzeichnis
// ============================================================
S.libTab = 'glossary';

async function ensureAllModules() {
  if (!S.curriculum) return;
  await Promise.all(S.curriculum.modules.map(async mod => {
    if (mod._data) return;
    try {
      const res = await fetch(mod.file);
      mod._data = await res.json();
    } catch { /* Modul fehlt im Glossar */ }
  }));
}

APP.openLibrary = async function () {
  const el = document.getElementById('library-content');
  if (!el) return;
  el.innerHTML = loadingHTML();
  await ensureAllModules();
  renderLibrary();
};

APP.setLibTab = function (tab) {
  S.libTab = tab;
  renderLibrary();
};

function renderLibrary() {
  const el = document.getElementById('library-content');
  if (!el || !S.curriculum) return;
  const mods = S.curriculum.modules.filter(m => m._data);

  const tabs = `
    <p class="lib-intro">${t('Alle Konzepte und akademischen Quellen des Kurses zum Nachschlagen — unabhängig vom Freischalt-Status.', 'All concepts and academic sources of the course for reference — independent of unlock status.')}</p>
    <div class="lib-tabs" role="tablist" aria-label="${t('Bibliothek-Ansicht', 'Library view')}">
      <button class="lib-tab ${S.libTab === 'glossary' ? 'active' : ''}" role="tab" aria-selected="${S.libTab === 'glossary'}" onclick="APP.setLibTab('glossary')">${t('Glossar', 'Glossary')}</button>
      <button class="lib-tab ${S.libTab === 'sources' ? 'active' : ''}" role="tab" aria-selected="${S.libTab === 'sources'}" onclick="APP.setLibTab('sources')">${t('Quellen', 'Sources')}</button>
    </div>`;

  if (S.libTab === 'glossary') {
    el.innerHTML = tabs + mods.map(mod => `
      <div class="gloss-mod">
        <div class="gloss-mod-h"><span aria-hidden="true">${mod.icon}</span> ${t(mod.titleDe, mod.titleEn)}</div>
        ${mod._data.lessons.map(l => {
          const c = S.lang === 'de' ? l.contentDe : l.contentEn;
          const firstSentence = (c.summary.match(/^[^.!?]*[.!?]/) || [c.summary])[0];
          return `
            <button class="gloss-item" onclick="APP.openModule('${mod.id}').then(()=>APP.openLesson('${l.id}'))" aria-label="${t(l.titleDe, l.titleEn)} — ${t('Lektion öffnen', 'open lesson')}">
              <span class="gloss-term">${t(l.titleDe, l.titleEn)}</span>
              <span class="gloss-def">${firstSentence}</span>
            </button>`;
        }).join('')}
      </div>`).join('');
  } else {
    // Quellen deduplizieren (Autor + Jahr + Titel), alphabetisch, mit Verweis auf Lektionen
    const map = new Map();
    mods.forEach(mod => mod._data.lessons.forEach(l => {
      const r = (S.lang === 'de' ? l.contentDe : l.contentEn).reference;
      const key = `${r.author}|${r.year}|${r.title}`;
      if (!map.has(key)) map.set(key, { ...r, uses: [] });
      map.get(key).uses.push({ modId: mod.id, lessonId: l.id, label: t(l.titleDe, l.titleEn) });
    }));
    const refs = [...map.values()].sort((a, b) => a.author.localeCompare(b.author) || a.year - b.year);
    el.innerHTML = tabs + `
      <p class="sec-label">${refs.length} ${t('Quellen', 'sources')}</p>
      ${refs.map(r => `
        <div class="lib-ref">
          <div class="lib-ref-author">${r.author} (${r.year})</div>
          <div class="lib-ref-title">${r.title}</div>
          <div class="ref-note" style="margin-bottom:8px">${r.note}</div>
          <div class="lib-ref-chips">
            ${r.uses.map(u => `<button class="lib-ref-chip" onclick="APP.openModule('${u.modId}').then(()=>APP.openLesson('${u.lessonId}'))">${u.label}</button>`).join('')}
          </div>
        </div>`).join('')}`;
  }
}

// Fortschritts-Export als JSON-Download (Backup)
APP.exportProgress = function () {
  const data = {
    exportedAt: new Date().toISOString(),
    app: 'MindFrame',
    progress: S.progress,
    srs: SRS.data,
    streak: S.streak,
    lastActivity: S.lastActivity,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mindframe-progress-${SRS.today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast(t('Export erstellt ✓', 'Export created ✓'));
};
